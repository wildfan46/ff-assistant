AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CI/CD-managed Lambda

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: >
      Neon Postgres connection string, injected via --parameter-overrides
      from a GitHub Actions secret. Never committed to this template.
      Use the POOLED connection string (hostname has a "-pooler" segment),
      not the direct one - each Lambda invocation opens a fresh connection,
      and the direct endpoint's max_connections can be exhausted by a burst
      of concurrent invocations (e.g. many users hitting this during a draft).

Globals:
  Function:
    Runtime: provided.al2023
    MemorySize: 128
    Timeout: 10
    Architectures: [arm64]
    Tags:
      Project: ff-assistant
      ManagedBy: sam

Resources:
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ff-assistant
      CodeUri: ./
      Handler: bootstrap
      Description: ff-assistant backend - fantasy football API, single Lambda handling multiple routes
      Environment:
        Variables:
          DATABASE_URL: !Ref DatabaseUrl
      Policies:
        - AWSLambdaBasicExecutionRole
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      BuildMethod: go1.x

  AppFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AppFunction}
      RetentionInDays: 14

  PlayerSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ff-assistant-player-sync
      CodeUri: cmd/player-sync/
      Handler: bootstrap
      Description: >
        Daily job: fetches the player list from Sleeper and upserts into
        players. Currently a hello-world stub - fetch/upsert/notify logic
        not yet implemented.
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        DailySync:
          Type: Schedule
          Properties:
            Schedule: cron(0 13 * * ? *)
            Name: ff-assistant-player-sync-daily
            Description: Triggers the daily Sleeper player sync
            Enabled: true
    Metadata:
      BuildMethod: go1.x

  PlayerSyncFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PlayerSyncFunction}
      RetentionInDays: 14

Outputs:
  AppFunctionUrl:
    Description: Direct HTTPS invoke URL for the ff-assistant function
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  AppFunctionName:
    Value: !Ref AppFunction
  PlayerSyncFunctionName:
    Value: !Ref PlayerSyncFunction